<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Outlast Trials [RU] — Community</title>
  <meta name="description" content="Русскоязычное сообщество The Outlast Trials: поиск игроков, совместные испытания и общение.">
  <meta name="theme-color" content="#171613">

  <!-- После публикации замени YOUR-USERNAME на свой GitHub username. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Outlast Trials [RU]">
  <meta property="og:title" content="THE OUTLAST TRIALS — RU COMMUNITY">
  <meta property="og:description" content="Русскоязычное сообщество для поиска игроков и совместного времяпровождения. Присоединяйся к нам!">
  <meta property="og:url" content="https://YOUR-USERNAME.github.io/outlast-trials-ru/">
  <meta property="og:image" content="https://YOUR-USERNAME.github.io/outlast-trials-ru/assets/og-preview.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <style>
    :root { color-scheme: dark; --bg:#11110f; --panel:#1c1b18; --gold:#d8bd78; --red:#8c3432; --muted:#b7b0a1; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; color:#f5f0df;
      background: radial-gradient(ellipse at 70% 0%, #30291b 0%, transparent 45%), var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      display:grid; place-items:center; padding:28px 16px;
    }
    .wrap { width:min(900px,100%); }
    .card {
      overflow:hidden; border:1px solid #55482c; border-radius:22px;
      background:linear-gradient(145deg,rgba(37,34,27,.97),rgba(18,18,16,.98));
      box-shadow:0 24px 80px #0009;
    }
    .hero { position:relative; background:#171613; }
    .hero img { display:block; width:100%; max-height:470px; object-fit:cover; object-position:center 43%; }
    .shade { position:absolute; inset:0; background:linear-gradient(0deg,rgba(12,12,10,.9),transparent 58%); }
    .hero-label { position:absolute; left:clamp(18px,4vw,42px); bottom:24px; }
    .eyebrow { color:var(--gold); font-size:.76rem; font-weight:800; letter-spacing:.28em; }
    h1 { margin:8px 0 0; font-size:clamp(2rem,6vw,4.2rem); line-height:.98; letter-spacing:.02em; text-transform:uppercase; }
    h1 span { color:var(--gold); }
    .content { padding:clamp(22px,4vw,38px); }
    .tag { display:inline-flex; gap:8px; align-items:center; border:1px solid #65532e; border-radius:999px; padding:7px 12px; color:var(--gold); font-size:.8rem; font-weight:700; }
    p { color:#ddd6c5; font-size:1.04rem; line-height:1.7; margin:18px 0 24px; }
    .actions { display:flex; flex-wrap:wrap; gap:12px; }
    a.button { display:inline-flex; align-items:center; justify-content:center; gap:9px; min-height:48px; padding:0 19px; border-radius:10px; text-decoration:none; font-weight:800; transition:transform .15s,filter .15s; }
    a.button:hover { transform:translateY(-2px); filter:brightness(1.1); }
    .primary { color:#17130b; background:linear-gradient(135deg,#e3cb8b,#b69a56); }
    .secondary { color:#f1e8d2; border:1px solid #655c48; background:#292721; }
    .foot { margin-top:20px; color:#8f8879; font-size:.8rem; }
    @media(max-width:520px) { .hero img { min-height:270px; } .actions a { width:100%; } }
  </style>
</head>
<body>
  <main class="wrap">
    <article class="card">
      <header class="hero">
        <img src="assets/logo.jpg" alt="Outlast Trials RU Community">
        <div class="shade"></div>
        <div class="hero-label">
          <div class="eyebrow">THE OUTLAST TRIALS</div>
          <h1><span>RU</span> COMMUNITY</h1>
        </div>
      </header>
      <section class="content">
        <div class="tag">◈ РУССКОЯЗЫЧНОЕ СООБЩЕСТВО</div>
        <p>Русскоязычное сообщество для поиска игроков и совместного времяпровождения. Находи напарников, собирай команду и проходи испытания вместе с нами.</p>
        <div class="actions">
          <a class="button primary" href="https://discord.gg/aZdapExxN" target="_blank" rel="noopener noreferrer">✦ Вступить в Discord</a>
          <a class="button secondary" href="https://discord.gg/aZdapExxN" target="_blank" rel="noopener noreferrer">Открыть приглашение ↗</a>
        </div>
        <div class="foot">OUTLAST TRIALS [RU] · COMMUNITY</div>
      </section>
    </article>
  </main>
</body>
</html>
