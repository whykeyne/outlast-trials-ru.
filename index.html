<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Outlast Trials [RU] — Community</title>
  <meta name="description" content="Русскоязычное сообщество The Outlast Trials: поиск игроков, совместные испытания и общение.">
  <meta name="theme-color" content="#171613">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Outlast Trials [RU]">
  <meta property="og:title" content="THE OUTLAST TRIALS — RU COMMUNITY">
  <meta property="og:description" content="Русскоязычное сообщество для поиска игроков и совместного времяпровождения. Присоединяйся к нам!">
  <meta property="og:url" content="https://github.io">
  <meta property="og:image" content="https://github.ioassets/logo.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <style>
    :root { 
      color-scheme: dark; 
      --bg: #0b0a08; 
      --panel: #161512; 
      --panel-light: #22201b;
      --gold: #d8bd78; 
      --gold-dim: #bda361;
      --red: #a63d3a; 
      --red-hover: #bd4845;
      --muted: #9e9684; 
      --text: #f5f0df;
      --anim-fast: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      --anim-slow: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    * { box-sizing: border-box; }
    ::selection { background: var(--red); color: #fff; }

    body {
      margin: 0; min-height: 100vh; color: var(--text);
      background: radial-gradient(ellipse at 50% 20%, #292419 0%, transparent 65%), var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      display: grid; place-items: center; padding: 40px 16px;
      overflow-x: hidden;
    }

    .wrap { width: min(800px, 100%); animation: fadeInTop var(--anim-slow); }
    
    .card {
      overflow: hidden; border: 1px solid #473d28; border-radius: 24px;
      background: linear-gradient(145deg, rgba(26,24,20,0.98), rgba(13,13,11,0.99));
      box-shadow: 0 30px 90px rgba(0,0,0,0.85);
      backdrop-filter: blur(10px);
    }
    
    .hero { position: relative; background: #131210; overflow: hidden; }
    .hero img { 
      display: block; width: 100%; max-height: 440px; 
      object-fit: cover; object-position: center 43%;
      transition: transform 5s ease;
    }
    .card:hover .hero img { transform: scale(1.03); }
    
    .shade { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(11,10,8,1) 0%, rgba(11,10,8,0.4) 50%, transparent 100%); }
    
    .hero-label { position: absolute; left: clamp(20px, 5vw, 45px); bottom: 28px; }
    .eyebrow { color: var(--gold); font-size: .8rem; font-weight: 800; letter-spacing: .3em; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
    h1 { margin: 8px 0 0; font-size: clamp(2.2rem, 6.5vw, 4.5rem); line-height: .95; letter-spacing: .01em; text-transform: uppercase; font-weight: 900; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.7)); }
    h1 span { color: var(--gold); }
    
    .content { padding: clamp(24px, 5vw, 45px); }
    .tag { display: inline-flex; gap: 8px; align-items: center; border: 1px solid #594b30; border-radius: 999px; padding: 8px 16px; color: var(--gold); font-size: .85rem; font-weight: 700; background: rgba(216,189,120,0.05); letter-spacing: 0.05em; }
    p { color: #d1c9b6; font-size: 1.1rem; line-height: 1.75; margin: 22px 0 32px; font-weight: 400; }
    
    .actions { display: flex; flex-wrap: wrap; gap: 16px; }
    
    .btn { 
      display: inline-flex; align-items: center; justify-content: center; gap: 10px; 
      min-height: 54px; padding: 0 28px; border-radius: 12px; text-decoration: none; 
      font-weight: 800; font-size: 0.95rem; letter-spacing: 0.02em;
      transition: transform var(--anim-fast), filter var(--anim-fast), box-shadow var(--anim-fast); 
      border: none; cursor: pointer; font-family: inherit;
    }
    .btn:hover { transform: translateY(-3px); }
    .btn:active { transform: translateY(-1px); }
    
    .btn-primary { color: #111; background: linear-gradient(135deg, #ebd496, var(--gold-dim)); box-shadow: 0 8px 24px rgba(216,189,120,0.2); }
    .btn-primary:hover { box-shadow: 0 12px 28px rgba(216,189,120,0.35); filter: brightness(1.08); }
    
    .btn-secondary { color: var(--text); border: 1px solid #544b38; background: rgba(34,32,27,0.5); backdrop-filter: blur(5px); }
    .btn-secondary:hover { background: rgba(46,44,37,0.8); border-color: var(--gold); }
    
    .btn-danger { color: #fff; background: linear-gradient(135deg, var(--red), #732624); box-shadow: 0 8px 24px rgba(166,61,58,0.2); }
    .btn-danger:hover { box-shadow: 0 12px 28px rgba(166,61,58,0.4); filter: brightness(1.1); }

    .foot { margin-top: 32px; color: var(--muted); font-size: .8rem; letter-spacing: 0.15em; font-weight: 600; text-transform: uppercase; border-top: 1px solid rgba(84,75,56,0.2); padding-top: 20px; }

    /* МОДАЛЬНОЕ ОКНО */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(5, 4, 3, 0.85);
      backdrop-filter: blur(8px); display: grid; place-items: center;
      opacity: 0; pointer-events: none; z-index: 100;
      transition: opacity var(--anim-slow); padding: 20px;
    }
    .modal-overlay.active { opacity: 1; pointer-events: all; }

    .modal-window {
      background: var(--panel); border: 1px solid #5c4e33; width: min(540px, 100%);
      border-radius: 20px; overflow: hidden; box-shadow: 0 40px 120px rgba(0,0,0,0.9);
      transform: scale(0.92) translateY(20px); opacity: 0;
      transition: transform var(--anim-slow), opacity var(--anim-slow);
    }
    .modal-overlay.active .modal-window { transform: scale(1) translateY(0); opacity: 1; }

    .modal-header { 
      background: linear-gradient(90deg, #1c1a16, #12110e);
      padding: 20px 28px; border-bottom: 1px solid #332d20;
      display: flex; justify-content: space-between; align-items: center;
    }
    .modal-header h2 { margin: 0; font-size: 1.25rem; color: var(--gold); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 800; }
    
    .modal-close {
      background: transparent; border: none; color: var(--muted); font-size: 1.6rem;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      width: 32px; height: 32px; border-radius: 50%; transition: background var(--anim-fast), color var(--anim-fast);
    }
    .modal-close:hover { background: rgba(255,255,255,0.05); color: #fff; }

    .modal-body { padding: 28px; }
    .form-group { margin-bottom: 20px; position: relative; }
    .form-group label { display: block; margin-bottom: 8px; font-size: 0.88rem; color: #c2baa8; font-weight: 600; letter-spacing: 0.02em; }
    
    .form-group input, .form-group textarea, .form-group select {
      width: 100%; background: #0d0c0a; border: 1px solid #4a3f2a; padding: 14px 16px;
      border-radius: 8px; color: var(--text); font-family: inherit; font-size: 0.95rem;
      transition: border-color var(--anim-fast), box-shadow var(--anim-fast);
    }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
      border-color: var(--gold); outline: none; box-shadow: 0 0 10px rgba(216,189,120,0.1);
    }
    .form-group textarea { resize: none; }

    .modal-footer { display: flex; justify-content: flex-end; gap: 12px; margin-top: 12px; }
    .modal-footer .btn { min-height: 48px; padding: 0 24px; font-size: 0.9rem; }

    #statusMessage { 
      padding: 12px 16px; border-radius: 8px; font-size: 0.92rem; font-weight: 700;
      margin-bottom: 16px; display: none; line-height: 1.4; animation: fadeIn var(--anim-fast);
    }

    @keyframes fadeInTop {
      from { opacity: 0; transform: translateY(-30px); filter: blur(5px); }
      to { opacity: 1; transform: translateY(0); filter: blur(0); }
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    @media(max-width: 540px) {
      body { padding: 16px 12px; }
      .actions .btn { width: 100%; }
      .modal-footer { flex-direction: column; }
      .modal-footer .btn { width: 100%; }
      .modal-body { padding: 20px; }
    }
  </style>
</head>
<body>

  <main class="wrap">
    <article class="card">
      <header class="hero">
        <img src="/outlast-trials-ru./assets/logo.jpg" alt="Outlast Trials RU Community">
        <div class="shade"></div>
        <div class="hero-label">
          <div class="eyebrow">THE OUTLAST TRIALS</div>
          <h1><span>RU</span> COMMUNITY</h1>
        </div>
      </header>
      
      <section class="content">
        <div class="tag">◈ РУССКОЯЗЫЧНОЕ СООБЩЕСТВО</div>
        <p>Русскоязычное сообщество для поиска игроков и совместного времяпровождения. Находи напарников, собирай команду и проходи испытания вместе с нами.</p>
        
        <div class="actions">
          <a class="btn btn-primary" href="https://discord.gg" target="_blank" rel="noopener noreferrer">✦ Вступить в Discord</a>
          <button class="btn btn-danger" id="openModalBtn">⚙ Открыть техподдержку</button>
        </div>
        
        <div class="foot">OUTLAST TRIALS [RU] · COMMUNITY</div>
      </section>
    </article>
  </main>

  <!-- МОДАЛЬНОЕ ОКНО ПОДДЕРЖКИ -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-window">
      <div class="modal-header">
        <h2>Центр обращений</h2>
        <button class="modal-close" id="closeModalBtn">&times;</button>
      </div>
      
      <div class="modal-body">
        <div id="statusMessage"></div>
        
        <form id="discordSupportForm">
          <div class="form-group">
            <label for="discordId">Ваш Discord ID / Никнейм:</label>
            <input type="text" id="discordId" required placeholder="Например, whykeyne">
          </div>
          
          <div class="form-group">
            <label for="reason">Тип Вашего обращения:</label>
